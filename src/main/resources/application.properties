spring.application.name=java-sapient-test-harness

logging.level.root=INFO
logging.level.io.sapient=DEBUG

edge-node.loader.base-dir=.

# address of the server to which this client will be connected to
fusion-node.host=localhost
# port of the server to which this client will be connected to
fusion-node.port=5000
# node id of the server to which this client will be connected to
fusion-node.id=00000000-0000-0000-0000-000000000000
# how the client checks that the server is still alive:
#   NETCAT   - opens and closes a TCP connection to the server
#   ICMP     - runs the system ping
#   ECHO     - in-band keepalive, the server echoes a zero-length frame
#   PINGPONG - in-band keepalive, the server answers with a 0xFFFFFFFF frame
# ECHO and PINGPONG need the server to run the same keepalive type
fusion-node.health-check.type=NETCAT
# how often a check starts
fusion-node.health-check.interval=10s
# how long one check may take. Must not exceed the interval. Increase it on a high-latency network
fusion-node.health-check.timeout=2s
# how many checks in a row must fail before the connection is dropped
fusion-node.health-check.failure-threshold=3
# Uncomment to enable TLS (tls/ directory required)
# fusion-node.tls.enabled=true
# fusion-node.tls.ca-cert=tls/ca.pem
# fusion-node.tls.client-cert=tls/cert.pem
# fusion-node.tls.client-key=tls/key.pem

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.boot.admin.context-path=/admin
spring.boot.admin.client.url=http://localhost:8080/admin
spring.boot.admin.client.instance.service-url=http://localhost:8080
